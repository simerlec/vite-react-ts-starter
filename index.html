<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite React TS Starter</title>
    <script>
      // Runs before first paint to avoid a flash of the wrong theme.
      // An explicit choice in localStorage wins; otherwise follow the OS setting.
      // src/hooks/useTheme.ts reads the resulting `dark` class as its initial state.
      let storedTheme = null;
      try {
        storedTheme = localStorage.getItem("theme");
      } catch {
        // Storage can be unavailable (e.g. blocked site data); fall back to the OS setting.
      }
      const isDark =
        storedTheme === "dark" ||
        (storedTheme === null &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", isDark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
